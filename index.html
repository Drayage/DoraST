<!DOCTYPE html>
<html lang="ko">
<head>

    <title>망각의 맹그로브 섬 - 로딩 중</title>
    <script>
        // PWA 비서 등록!
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')

                .catch((err) => console.log('비서가 뻗었어, 언니:', err));
        }
        // 경로에 언더바(_) 확인 완료! 0초만에 이동!
        window.location.replace("./island_escape/game.html");
    </script>
    <style>
        body { background: #0a0e14; color: #e8b84b; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
    </style>
</head>

    <p>섬으로 끌려가는 중... 🌊🛶</p>
</body>
</html>
