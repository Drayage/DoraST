<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="무인도 탈출!">
    <meta name="theme-color" content="#e8b84b">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-512.png">

    <title>무인도 탈출 - 생존기</title>

    <script>
        // PWA 비서(Service Worker) 등록 - 더 확실한 방법으로!
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('리완료! ✅', reg.scope))
                    .catch(err => console.error('❌', err));
            });
        }

        // 0.5초만 기다렸다가 게임으로 이동 (PWA 등록 시간을 벌어주는 거야!)
        setTimeout(() => {
            window.location.replace("./island_escape/game.html");
        }, 500);
    </script>
    <style>
        body { background: #0a0e14; color: #e8b84b; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <p>망각의 섬으로 진입 중...</p>
        <small style="opacity: 0.5;">PWA 엔진 가동 중</small>
    </div>
</body>
</html>
